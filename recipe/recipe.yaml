schema_version: 1

context:
  python_min: "3.12"
  version: "1.5.0.20260810"

package:
  name: types-rasterio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-rasterio/types_rasterio-${{ version }}.tar.gz
  sha256: 45e2e43dc5c97eeaf2f3c9f8b89b3d269914d1cf2a0a2c32e6fe029ee79dd5e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2
    - click >=8

tests:
  - package_contents:
      site_packages:
        - rasterio-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Typing stubs for rasterio
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - p-vdp
