schema_version: 1

context:
  python_min: "3.12"
  version: "1.5.1.20260819"

package:
  name: types-rasterio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-rasterio/types_rasterio-${{ version }}.tar.gz
  sha256: 6cd7efa6dc190bf5b1fe8966413b427bdea308587a93c03cce48a296e805b102

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - pip
  run:
    - python >=${{ python_min }}
    - affine >=3
    - click >=8
    - numpy >=2

tests:
  - package_contents:
      site_packages:
        - rasterio-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Typing stubs for rasterio
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - p-vdp
